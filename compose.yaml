services:
  busservice:
    build: ./buses-service
    ports:
      -"1111:3000"
    container_name: busscont1
    networks:
      - bussnetwork
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
  flightservice:
    build: ./flights-service
    ports:
      -"2222:3000"
    container_name: flightcont1
    networks:
      - flightnetwork
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
  movieservice:
    build: ./movies-service
    ports:
      -"3333:3000"
    container_name: moviecont1
    networks:
      - movienetwork
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
  trainservice:
    build: ./trains-service
    ports:
      -"4444:3000"
    container_name: traincont1
    networks:
      - trainnetwork
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

networks:
  bussnetwork:
    driver: overlay
  flightnetwork:
    driver: overlay    
  movienetwork:
    driver: overlay
  trainnetwork:
    driver: overlay    