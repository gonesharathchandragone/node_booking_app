services:
  buses_service:
    build: ./busses-service
    ports:
      -"1111:3000"
    networks:
      - bussnetwork
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
  flights_service:
    build: ./flights-service
    ports:
      - "2222:3000"
    networks:
      - flightsnetwork
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
  movies_service:
    build: ./movies-service 
    ports:
      - "3333:3000" 
    networks:
      - moviesnetwork
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
  


