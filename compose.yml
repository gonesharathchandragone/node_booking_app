services:
  buses_service:
    build: ./buses-service
    container_name: buss_cont
    ports:
      -"1111:3000"
    networks:
      - bussnetwork
    restart: unless-stopped
  movies_service:
    build: ./movies-service
    container_name: movie_cont
    ports:
      -"2222:3000"
    networks:
      - movienetwork
    restart: unless-stopped
  train_service:
    build: ./trains-service
    container_name: trains_cont
    ports:
      -"3333:3000"
    networks:
      - trainnetwork
    restart: unless-stopped
  flights_service:
    build: ./flights-service
    container_name: flights_cont
    ports:
      -"4444:3000"
    networks:
      - flightnetwork
    restart: unless-stopped
networks:
  bussnetwork:
    driver: bridge
  movienetwork:
    driver: bridge
  trainnetwork:
    driver: bridge
  flightnetwork:
    driver: bridge  